name: Build
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            deps: pandas==1.3.4 numpy==1.21.6 matplotlib==3.5.0
          - python-version: "3.12"
            deps: pandas numpy matplotlib
          - python-version: "3.13"
            deps: pandas numpy matplotlib
          - python-version: "3.14"
            deps: pandas numpy matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ${{ matrix.deps }}
          pip install .
          cp ci/matplotlibrc matplotlibrc
      - name: test
        run: pytest
      - name: Coveralls
        uses: coverallsapp/github-action@v2
